          nullable: true
          title: Fecha inicia garantía
        warranty_end_date:
          type: string
          format: date
          nullable: true
          title: Fecha finaliza garantía
        maintenance_provider:
          type: string
          title: Proveedor de mantenimiento
          maxLength: 150
        maintenance_frequency_months:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
          title: Frecuencia mantenimiento (meses)
        last_preventive:
          type: string
          title: Último preventivo
          maxLength: 120
        next_preventive:
          type: string
          title: Próximo preventivo
          maxLength: 120
        calibration_date:
          type: string
          title: Código de calibración
          maxLength: 50
        calibration_frequency_months:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
          title: Frecuencia calibración (meses)
        last_calibration:
          type: string
          title: Última calibración
          maxLength: 120
        next_calibration:
          type: string
          title: Próxima calibración
          maxLength: 120
        corrective_count:
          type: integer
          maximum: 2147483647
          minimum: 0
          title: Número de correctivos.
        electrical_safety_class:
          type: string
          title: Clase seguridad eléctrica
          maxLength: 80
        electrical_safety_type:
          type: string
          title: Tipo seguridad eléctrica
          maxLength: 80
        invima_registration:
          type: string
          title: Registro Invima
          maxLength: 80
        ecri:
          type: string
          maxLength: 80
        life_use_years:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
          title: Vida útil (años)
        observations:
          type: string
          title: Observaciones
        equipment_image:
          type: string
          format: uri
          nullable: true
          title: Imagen del equipo
        life_sheet_pdf:
          type: string
          format: uri
          nullable: true
          title: Hoja Vida PDF
        status:
          allOf:
          - $ref: '#/components/schemas/EquipmentStatusEnum'
          title: Estado
        status_display:
          type: string
          readOnly: true
        mtbf_hours:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
          title: MTBF (horas)
          description: Tiempo promedio entre fallas consecutivas. Recalculado automáticamente.
        mttr_hours:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$

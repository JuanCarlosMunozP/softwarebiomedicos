components:
  schemas:
    AttachmentTypeEnum:
      enum:
      - LIFE_SHEET
      - MANUAL
      - PHOTO
      - CERTIFICATE
      - WARRANTY
      - PURCHASE
      - OTHER
      type: string
      description: |-
        * `LIFE_SHEET` - Hoja de Vida
        * `MANUAL` - Manual
        * `PHOTO` - Fotografía
        * `CERTIFICATE` - Certificado
        * `WARRANTY` - Garantía
        * `PURCHASE` - Compra
        * `OTHER` - Otro
    BlankEnum:
      enum:
      - ''
    Branch:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Nombre
          description: Nombre único de la sede.
          maxLength: 120
        address:
          type: string
          title: Dirección
          maxLength: 255
        city:
          type: string
          title: Ciudad
          maxLength: 80
        phone:
          type: string
          title: Teléfono
          pattern: ^\+?[0-9\s\-()]{7,20}$
          maxLength: 30
        email:
          title: Correo electrónico
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        is_active:
          type: boolean
          title: Activa
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Creada
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Actualizada
      required:
      - address
      - city
      - created_at
      - id
      - name
      - phone
      - updated_at
    BranchRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          title: Nombre
          description: Nombre único de la sede.
          maxLength: 120
        address:
          type: string
          minLength: 1
          title: Dirección
          maxLength: 255
        city:
          type: string
          minLength: 1
          title: Ciudad
          maxLength: 80
        phone:
          type: string
          minLength: 1
          title: Teléfono
          pattern: ^\+?[0-9\s\-()]{7,20}$
          maxLength: 30
        email:
          title: Correo electrónico
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        is_active:
          type: boolean
          title: Activa
      required:
      - address
      - city
      - name
      - phone
    Brand:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Nombre
          description: Nombre comercial único de la marca.
          maxLength: 120
        is_active:
          type: boolean
          title: Activa
        created_at:
          type: string
          format: date-time
          readOnly: true

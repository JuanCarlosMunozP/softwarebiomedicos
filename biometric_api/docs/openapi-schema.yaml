          format: uri
          nullable: true
          readOnly: true
          title: Código QR
        qr_code_url:
          type: string
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Creado
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Actualizado
      required:
      - asset_tag

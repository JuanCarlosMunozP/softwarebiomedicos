name: Backend CI

# Corre lint + tests de biometric_api en cada push/PR que toque ese
# directorio. La suite ya existía (53 archivos de test con factories/
# fixtures) pero hasta ahora solo se ejecutaba a mano.
on:
  push:
    branches: [main]
    paths:
      - "biometric_api/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "biometric_api/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: biometric_api

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: biometric_api/requirements/dev.txt

      - run: pip install -r requirements/dev.txt
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: biometric_db
          POSTGRES_USER: biometric_user
          POSTGRES_PASSWORD: biometric_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U biometric_user -d biometric_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      # Solo para CI: no es un secreto real, dev.py no lo usa para nada
      # sensible (prod.py sí exige uno real vía ImproperlyConfigured).
      DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production-use
      DJANGO_DEBUG: "True"
      POSTGRES_DB: biometric_db
      POSTGRES_USER: biometric_user
      POSTGRES_PASSWORD: biometric_pass
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: biometric_api/requirements/dev.txt

      - run: pip install -r requirements/dev.txt

      - name: Migraciones aplican sin errores
        run: python manage.py migrate --noinput

      - name: No hay cambios de modelo sin migración
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        run: pytest
